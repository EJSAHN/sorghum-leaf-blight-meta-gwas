name: release

on:
  push:
    tags: ['v2.0.2']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Check tag and version
        run: |
          test "$GITHUB_REF_NAME" = "v2.0.2"
          test "$(tr -d '\r\n' < VERSION)" = "2.0.2"
      - name: Verify exact source files
        run: python tools/verify_source.py
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m compileall -q src tools
          python -m pytest -q
      - name: Verify source after tests
        run: python tools/verify_source.py

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release already exists; no tag or release is modified."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES_v2.0.2.md
          fi
